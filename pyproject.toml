[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-moments-automation"
version = "0.6.9"
description = "版本无关的PC微信朋友圈自动化系统 - 事件驱动 + 语义定位 + 三层集成"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "WeChat Moments Automation"},
]
keywords = ["wechat", "automation", "rpa", "gui-automation", "ocr", "opencv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7.0", "paddlepaddle"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "pydantic>=2.0.0", "croniter>=2.0.0"]
agent = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pywin32>=306",
    "websockets>=12.0",
    "Pillow>=10.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "jsonschema>=4.23.0",
]
packaging = [
    "pyinstaller>=6.10.0",
]
full = [
    "opencv-contrib-python==4.10.0.84",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pywin32>=306",
    "pefile>=2023.2.7",
    "pywinauto>=0.6.8",
    "PyYAML>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "croniter>=2.0.0",
    "httpx>=0.27.0",
    "paddleocr>=2.7.0",
    "paddlepaddle",
]

[project.scripts]
wechat-moments = "main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
